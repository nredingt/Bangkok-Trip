<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bangkok Christmas Trip 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#FDF6EC;font-family:Georgia,serif;color:#2D2010;min-height:100vh;}
.hero{padding:44px 20px 36px;text-align:center;position:relative;overflow:hidden;background:#1A1208;}
.hero-eye{position:relative;z-index:2;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#C9975A;margin-bottom:12px;}
.hero h1{position:relative;z-index:2;font-size:clamp(26px,6vw,48px);color:#FFF8EE;line-height:1.2;}
.hero h1 span{color:#E8C38A;}
.hero-dates{position:relative;z-index:2;margin-top:12px;font-size:13px;color:rgba(255,248,238,.55);letter-spacing:.08em;}
.hero-div{position:relative;z-index:2;width:40px;height:2px;background:#C9975A;margin:18px auto 0;}
.tab-bar{background:#1A1208;display:flex;justify-content:center;gap:6px;padding:10px 16px;border-top:1px solid rgba(201,151,90,.2);}
.tab-btn{padding:7px 20px;border:1px solid rgba(201,151,90,.35);border-radius:20px;background:transparent;color:rgba(255,248,238,.5);font-size:12px;cursor:pointer;letter-spacing:.05em;}
.tab-btn.active{background:#C9975A;color:#1A1208;font-weight:700;border-color:#C9975A;}
.content{max-width:680px;margin:0 auto;padding:24px 14px 60px;display:flex;flex-direction:column;gap:14px;}
.card{background:#FFFDF8;border:1px solid #EBE0CE;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(26,18,8,.06);}
.card-head{display:flex;align-items:center;gap:12px;padding:13px 16px 11px;border-bottom:1px solid #EBE0CE;background:rgba(201,151,90,.06);}
.card-icon{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
.card-meta{flex:1;}
.card-date{display:block;font-size:11px;font-weight:700;color:#7A6A55;letter-spacing:.07em;text-transform:uppercase;}
.card-label{display:block;font-size:16px;font-weight:700;color:#2D2010;margin-top:2px;}
.card-body{padding:11px 16px;display:flex;flex-direction:column;gap:7px;}
.ev-row{display:flex;gap:10px;align-items:baseline;}
.ev-time{font-size:11px;font-weight:700;color:#C9975A;min-width:68px;flex-shrink:0;text-transform:uppercase;letter-spacing:.03em;}
.ev-text{font-size:13.5px;color:#2D2010;line-height:1.5;}
.conf{font-family:monospace;background:rgba(201,151,90,.12);color:#C9975A;padding:1px 5px;border-radius:3px;font-size:12px;}
.badge-confirmed{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#2D6A4F;color:#fff;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle;}
.hotel-room{margin:6px 0 2px;padding:9px 11px;background:rgba(201,151,90,.06);border-radius:8px;border-left:3px solid #C9975A;}
.room-g{font-weight:700;font-size:13px;margin-bottom:3px;}
.room-t{font-size:13px;color:#7A6A55;margin-bottom:2px;}
.room-c{font-size:12px;color:#7A6A55;margin-bottom:2px;}
.room-n{font-size:11.5px;color:#7A6A55;line-height:1.4;margin-top:3px;}
.note-section{border-top:1px dashed #EBE0CE;padding:9px 16px 11px;}
.note-text{font-size:13px;color:#7A6A55;margin-bottom:5px;line-height:1.4;}
.note-btn{font-size:12px;color:#C9975A;background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;}
.note-edit{display:none;flex-direction:column;gap:6px;}
.note-edit textarea{width:100%;padding:7px 9px;border:1px solid #EBE0CE;border-radius:6px;font-family:Georgia,serif;font-size:13px;color:#2D2010;background:#FFFDF8;resize:none;}
.note-actions{display:flex;gap:7px;}
.btn-save{padding:5px 14px;background:#C9975A;color:#1A1208;border:none;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-cancel{padding:5px 14px;background:transparent;color:#7A6A55;border:1px solid #EBE0CE;border-radius:5px;font-size:12px;cursor:pointer;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,18,8,.65);z-index:100;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.footer{text-align:center;padding:20px;font-size:11px;color:#7A6A55;letter-spacing:.06em;}
.gate{position:fixed;inset:0;background:#1A1208;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;}
.gate h2{font-family:Georgia,serif;font-size:28px;color:#FFF8EE;margin-bottom:8px;}
.gate p{font-size:13px;color:rgba(255,248,238,.5);margin-bottom:28px;letter-spacing:.06em;}
.gate input{width:200px;padding:10px 14px;border:1px solid #C9975A;border-radius:24px;background:transparent;color:#FFF8EE;font-size:16px;text-align:center;letter-spacing:.1em;outline:none;margin-bottom:12px;}
.gate input::placeholder{color:rgba(255,248,238,.3);}
.gate button{padding:10px 28px;background:#C9975A;color:#1A1208;border:none;border-radius:24px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.06em;}
.gate-error{font-size:12px;color:#E07070;margin-top:10px;display:none;}
.poll-wrap{overflow-x:auto;margin:10px 0 4px;}
.poll-table{border-collapse:collapse;min-width:100%;font-size:12px;}
.poll-table th{background:rgba(201,151,90,.12);color:#7A6A55;font-weight:700;font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:7px 8px;white-space:nowrap;border:1px solid #EBE0CE;}
.poll-table td{padding:6px 8px;border:1px solid #EBE0CE;white-space:nowrap;vertical-align:middle;}
.poll-table td.choice-label{font-size:13px;color:#2D2010;font-weight:600;background:#FFFDF8;min-width:140px;}
.poll-cell{text-align:center;}
.poll-vote{width:28px;height:28px;border-radius:50%;border:1px solid #EBE0CE;background:#FFFDF8;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;}
.poll-vote.yes{background:#E8F5E9;border-color:#81C784;}
.poll-vote.no{background:#FDECEA;border-color:#E57373;}
.poll-vote.none{background:#FFFDF8;border-color:#EBE0CE;}
.poll-label{font-size:10px;color:#7A6A55;margin-top:2px;display:block;}
.rsvp-section{margin:6px 0 4px;padding:8px 0 4px;border-top:1px dashed #EBE0CE;}
.rsvp-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7A6A55;margin-bottom:6px;}
.rsvp-names{display:flex;flex-wrap:wrap;gap:5px;}
.rsvp-btn{padding:4px 9px;border-radius:12px;font-size:12px;cursor:pointer;border:1px solid #EBE0CE;background:#FFFDF8;color:#2D2010;font-family:Georgia,serif;}
.rsvp-yes{background:#E8F5E9;border-color:#81C784;color:#2D6A4F;}
.rsvp-no{background:#FDECEA;border-color:#E57373;color:#C0392B;text-decoration:line-through;}
.rsvp-none{background:#FFFDF8;border-color:#EBE0CE;color:#7A6A55;}
.rsvp-count{font-size:11px;color:#2D6A4F;font-weight:600;margin-top:5px;}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCI66yCd9B6ie9ZeUraU2Tfu_TfoYdeAe4",
  authDomain: "bangkok-trip-f3d62.firebaseapp.com",
  databaseURL: "https://bangkok-trip-f3d62-default-rtdb.firebaseio.com",
  projectId: "bangkok-trip-f3d62",
  storageBucket: "bangkok-trip-f3d62.firebasestorage.app",
  messagingSenderId: "285706387269",
  appId: "1:285706387269:web:8f5785224a31579e01c82c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Sync Poll from Firebase in real time
onValue(ref(db, "trip/poll"), function(snap) {
  window._fbPoll = snap.val() || {};
  if (window._refreshPoll) window._refreshPoll();
});

window._togglePoll = function(choice, name) {
  var poll = window._fbPoll || {};
  if (!poll[choice]) poll[choice] = {};
  var cur = poll[choice][name];
  if (cur === undefined || cur === null) poll[choice][name] = true;
  else if (cur === true) poll[choice][name] = false;
  else delete poll[choice][name];
  set(ref(db, "trip/poll/" + choice), poll[choice]);
};

// Sync RSVPs from Firebase in real time
onValue(ref(db, "trip/rsvps"), function(snap) {
  window._fbRsvps = snap.val() || {};
  if (window._refreshRsvps) window._refreshRsvps();
});

window._toggleRsvp = function(dayIdx, evtIdx, name) {
  var rsvps = window._fbRsvps || {};
  var key = dayIdx + "_" + evtIdx;
  if (!rsvps[key]) rsvps[key] = {};
  var cur = rsvps[key][name];
  if (cur === undefined || cur === null) rsvps[key][name] = true;
  else if (cur === true) rsvps[key][name] = false;
  else { delete rsvps[key][name]; }
  set(ref(db, "trip/rsvps/" + key), rsvps[key]);
};

// Sync notes from Firebase in real time
onValue(ref(db, "trip/notes"), function(snap) {
  window._fbNotes = snap.val() || {};
  // Refresh displayed notes without full re-render
  Object.keys(window._fbNotes).forEach(function(i) {
    var nd = document.getElementById("nd"+i);
    if (nd) {
      var val = window._fbNotes[i];
      nd.innerHTML = (val ? '<p class="note-text">📌 '+val+'</p>' : '') +
        '<button class="note-btn" onclick="openNote('+i+')">'+(val?'Edit note':'+ Add note')+'</button>';
    }
  });
});

window._saveNoteToFirebase = function(i, val) {
  set(ref(db, "trip/notes/"+i), val);
};
</script>

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderTab(tab);
}

function renderTab(tab) {
  var c = document.getElementById('content');
  if (tab === 'itinerary') renderItinerary(c);
  else if (tab === 'travelers') renderTravelers(c);
  else renderHotels(c);
}

var POLL_CHOICES = [
  "Ayutthaya",
  "Cooking Class",
  "IconSiam",
  "Hotel Pool / Open Day"
];

window._refreshPoll = function() {
  var el = document.getElementById("poll-table-body");
  if (!el) return;
  el.innerHTML = renderPollRows();
};

function renderPollRows() {
  var poll = window._fbPoll || {};
  var html = "";
  POLL_CHOICES.forEach(function(choice, ci) {
    html += "<tr>";
    html += "<td class='choice-label'>" + (ci+1) + ". " + choice + "</td>";
    FAMILY.forEach(function(name) {
      var state = (poll[ci] || {})[name];
      var icon = state === true ? "✅" : state === false ? "❌" : "○";
      var cls = state === true ? "yes" : state === false ? "no" : "none";
      html += "<td class='poll-cell'><button class='poll-vote " + cls + "' onclick='doPollVote(" + ci + ",\'" + name + "\')' title='" + name + "'>" + icon + "</button><span class='poll-label'>" + name.substring(0,4) + "</span></td>";
    });
    html += "</tr>";
  });
  return html;
}

function doPollVote(ci, name) {
  if (window._togglePoll) window._togglePoll(ci, name);
  else {
    // local fallback
    window._fbPoll = window._fbPoll || {};
    if (!window._fbPoll[ci]) window._fbPoll[ci] = {};
    var cur = window._fbPoll[ci][name];
    if (!cur) window._fbPoll[ci][name] = true;
    else if (cur === true) window._fbPoll[ci][name] = false;
    else delete window._fbPoll[ci][name];
    window._refreshPoll();
  }
}

window._refreshRsvps = function() {
  Object.keys(RSVP_EVENTS).forEach(function(key) {
    var el = document.getElementById("rsvp-"+key);
    if (!el) return;
    var rsvps = (window._fbRsvps || {})[key] || {};
    var attending = FAMILY.filter(function(n){ return rsvps[n]; });
    var notAttending = FAMILY.filter(function(n){ return rsvps[n] === false; });
    el.innerHTML = renderRsvpBlock(key, rsvps);
  });
};

function renderRsvpBlock(key, rsvps) {
  var html = '<div class="rsvp-names">';
  FAMILY.forEach(function(name) {
    var state = rsvps[name];
    var cls = state === true ? "rsvp-yes" : state === false ? "rsvp-no" : "rsvp-none";
    var icon = state === true ? "✅" : state === false ? "❌" : "○";
    html += '<button class="rsvp-btn '+cls+'" onclick="doRsvp(\'' + key + '\',\'' + name + '\')">'
      + icon + ' ' + name + '</button>';
  });
  html += '</div>';
  var attending = FAMILY.filter(function(n){ return rsvps[n] === true; });
  if (attending.length > 0) {
    html += '<div class="rsvp-count">'+attending.length+' attending</div>';
  }
  return html;
}

function doRsvp(key, name) {
  if (window._toggleRsvp) {
    window._toggleRsvp(key.split("_")[0], key.split("_")[1], name);
  }
}

function renderItinerary(c) {
  c.innerHTML = '';
  ITINERARY.forEach(function(day, i) {
    var evHTML = day.events.map(function(e, j){
      var key = i+"_"+j;
      var rsvpHTML = "";
      if (RSVP_EVENTS[key]) {
        var rsvps = (window._fbRsvps || {})[key] || {};
        rsvpHTML = '<div class="rsvp-section"><div class="rsvp-label">Who is coming?</div>'
          + '<div id="rsvp-'+key+'">' + renderRsvpBlock(key, rsvps) + '</div></div>';
      }
      var evContent;
      if (e.x === "__POLL__") {
        evContent = '<div class="poll-wrap"><table class="poll-table"><thead><tr><th>Option</th>' +
          FAMILY.map(function(n){ return "<th>" + n.substring(0,4) + "</th>"; }).join("") +
          "</tr></thead><tbody id='poll-table-body'>" + renderPollRows() + "</tbody></table></div>";
      } else {
        evContent = '<div class="ev-row"><span class="ev-time">'+e.t+'</span><span class="ev-text">'+e.x+'</span></div>';
      }
      return evContent + rsvpHTML;
    }).join('');
    var noteVal = notes[i] || '';
    var div = document.createElement('div');
    div.className = 'card';
    div.innerHTML =
      '<div class="card-head"><span class="card-icon">'+day.icon+'</span><div class="card-meta"><span class="card-date">'+day.date+'</span><span class="card-label">'+day.label+'</span></div>'+(isAdmin ? '<button onclick="openEdit('+i+')" style="font-size:11px;padding:4px 10px;border:1px solid #C9975A;border-radius:5px;background:transparent;color:#C9975A;cursor:pointer;flex-shrink:0;">Edit</button>' : '')+'</div>'+
      '<div class="card-body">'+evHTML+'</div>'+
      '<div class="note-section">'+
        '<div id="nd'+i+'">'+(noteVal?'<p class="note-text">📌 '+noteVal+'</p>':'')+
          '<button class="note-btn" onclick="openNote('+i+')">'+( noteVal?'Edit note':'+ Add note')+'</button></div>'+
        '<div class="note-edit" id="ne'+i+'">'+
          '<textarea id="ni'+i+'" rows="2" placeholder="Add a note for the family...">'+noteVal+'</textarea>'+
          '<div class="note-actions">'+
            '<button class="btn-save" onclick="saveNote('+i+')">Save</button>'+
            '<button class="btn-cancel" onclick="closeNote('+i+')">Cancel</button>'+
          '</div></div>'+
      '</div>';
    c.appendChild(div);
  });
}

function renderTravelers(c) {
  c.innerHTML = '';
  TRAVELERS.forEach(function(t) {
    var rows = t.flights.map(function(f){
      return '<div class="ev-row"><span class="ev-time">'+f.f+'</span><span class="ev-text">'+f.r+' · '+f.d+' · Seat(s) '+f.s+(f.cabin?' · '+f.cabin:'')+' · <span class="conf">'+f.c+'</span></span></div>';
    }).join('');
    var div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = '<div class="card-head"><span class="card-icon">👤</span><div class="card-meta"><span class="card-label">'+t.name+'</span></div></div><div class="card-body">'+rows+'</div>';
    c.appendChild(div);
  });
}

function renderHotels(c) {
  c.innerHTML = '';
  HOTELS.forEach(function(h) {
    h.stays.forEach(function(stay) {
      var rooms = stay.rooms.map(function(r){
        return '<div class="hotel-room"><div class="room-g">'+r.g+'</div><div class="room-t">'+r.t+'</div><div class="room-c">Conf: <span class="conf">'+r.c+'</span></div>'+(r.n?'<div class="room-n">'+r.n+'</div>':'')+'</div>';
      }).join('');
      var div = document.createElement('div');
      div.className = 'card';
      div.innerHTML =
        '<div class="card-head"><span class="card-icon">'+h.icon+'</span><div class="card-meta"><span class="card-label">'+h.name+'</span><span class="card-date">'+stay.period+'</span></div></div>'+
        '<div class="card-body">'+
          '<div class="ev-row"><span class="ev-time">Address</span><span class="ev-text">'+h.addr+'</span></div>'+
          (h.phone?'<div class="ev-row"><span class="ev-time">Phone</span><span class="ev-text">'+h.phone+'</span></div>':'')+
          rooms+
        '</div>';
      c.appendChild(div);
    });
  });
}

function openNote(i) {
  document.getElementById('nd'+i).style.display='none';
  var ne = document.getElementById('ne'+i);
  ne.style.display='flex';
  document.getElementById('ni'+i).focus();
}

function closeNote(i) {
  document.getElementById('nd'+i).style.display='';
  document.getElementById('ne'+i).style.display='none';
}

function saveNote(i) {
  var val = document.getElementById('ni'+i).value.trim();
  notes[i] = val;
  if (window._saveNoteToFirebase) {
    window._saveNoteToFirebase(i, val);
  } else {
    localStorage.setItem('bkk_notes', JSON.stringify(notes));
  }
  closeNote(i);
  renderTab(currentTab);
}

var editingDay = null;
var ADMIN_PIN = "1225";

function checkPin() {
  var pin = document.getElementById('pin-input').value;
  if (pin === ADMIN_PIN) {

function openEdit(i) {
  editingDay = i;
  var day = ITINERARY[i];
  document.getElementById('modal-date').value = day.date;
  document.getElementById('modal-label').value = day.label;
  document.getElementById('modal-icon').value = day.icon;
  document.getElementById('modal-events').value = day.events.map(function(e){ return e.t ? e.t + ' | ' + e.x : e.x; }).join('\n');
  document.getElementById('edit-modal').classList.add('open');
}

function closeEdit() {
  document.getElementById('edit-modal').classList.remove('open');
}

function saveEdit() {
  var i = editingDay;
  ITINERARY[i].date = document.getElementById('modal-date').value;
  ITINERARY[i].label = document.getElementById('modal-label').value;
  ITINERARY[i].icon = document.getElementById('modal-icon').value;
  ITINERARY[i].events = document.getElementById('modal-events').value.split('\n').filter(function(l){ return l.trim(); }).map(function(l){
    var p = l.split('|');
    return p.length > 1 ? {t: p[0].trim(), x: p[1].trim()} : {t: '', x: l.trim()};
  });
  closeEdit();
  renderTab(currentTab);
}

renderTab('itinerary');

<script>
// Check if already authenticated this session
if (sessionStorage.getItem('bkk_auth') === 'yes') {
  document.addEventListener('DOMContentLoaded', function() {
    var g = document.getElementById('gate');
    if (g) g.style.display = 'none';
  });
}

function checkGate() {
  var val = document.getElementById('gate-input').value;
  if (val.toLowerCase() === 'noodles') {
    sessionStorage.setItem('bkk_auth', 'yes');
    document.getElementById('gate').style.display = 'none';
  } else {
    document.getElementById('gate-error').style.display = 'block';
    document.getElementById('gate-input').value = '';
  }
}

document.addEventListener('DOMContentLoaded', function() {
  var input = document.getElementById('gate-input');
  if (input) {
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkGate();
    });
  }
});
</script>
